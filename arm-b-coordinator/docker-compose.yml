# Arm B storage: 3-node etcd cluster (Raft, tolerates 1 crashed node).
# Image pinned by digest (pulled 18 Nov 2026). Data lives inside the containers:
# `docker compose down -v` gives a fresh cluster for every run (design Section 5).
x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.6.14@sha256:a491baeaa0cb0c9cd89c0062ac44ece53886e3e5bddad18d2daf36678ce665b6
  restart: "no"

services:
  etcd1:
    <<: *etcd
    container_name: etr-etcd1
    command: >
      etcd --name etcd1 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd1:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd1:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token etr-arm-b --initial-cluster-state new
    ports: ["23791:2379"]
  etcd2:
    <<: *etcd
    container_name: etr-etcd2
    command: >
      etcd --name etcd2 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd2:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd2:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token etr-arm-b --initial-cluster-state new
    ports: ["23792:2379"]
  etcd3:
    <<: *etcd
    container_name: etr-etcd3
    command: >
      etcd --name etcd3 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd3:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd3:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token etr-arm-b --initial-cluster-state new
    ports: ["23793:2379"]

  # Benchmark only (profile "bench"): `npm run etcd:up` still starts just the 3 etcd nodes.
  coordinator:
    image: etr-node:dev
    container_name: etr-coordinator
    profiles: ["bench"]
    working_dir: /app/arm-b-coordinator
    command: ["node", "src/main.js"]
    environment:
      PORT: "8080"
      ETCD_ENDPOINTS: "http://etcd1:2379,http://etcd2:2379,http://etcd3:2379"
      CLOCK_SKEW_MS: "${CLOCK_SKEW_MS:-0}"
      CENSOR_CENTRES: "${CENSOR_CENTRES:-}"
    cpus: 1.0
    ports: ["18081:8080"]
    depends_on: [etcd1, etcd2, etcd3]
    restart: "no"
