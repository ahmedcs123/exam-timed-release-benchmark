# F5 only: besu4 runs the libfaketime image with its wall clock CLOCK_SKEW_S seconds ahead. The monotonic clock is
# left alone (the JVM relies on it for timers). Used as an extra -f file on top of network/generated/docker-compose.yml.
services:
  besu4:
    image: etr-besu-faketime:dev
    environment:
      # Multi-threaded variant: the JVM is multi-threaded. With the single-threaded libfaketime.so.1 the shell in the
      # container was 30 s ahead but Besu's own (JVM) log times were not (smoke 2026-11-20).
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/faketime/libfaketimeMT.so.1
      FAKETIME: "+${CLOCK_SKEW_S:-30}s"
      FAKETIME_DONT_FAKE_MONOTONIC: "1"
      FAKETIME_DONT_RESET: "1"
